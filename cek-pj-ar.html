<!DOCTYPE html>
<html lang="id">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3a5f">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cek PJ - AR</title>
<script src="theme.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--bd:#dde3ea;--tx:#1d2733;--mu:#6b7785;--pri:#1e3a5f;--red:#c62828;--redb:#fdecec;--grn:#1b7a46;--grnb:#e8f5ee;--amb:#b26a00;--ambb:#fff4de}
[data-theme=dark]{--bg:#0f172a;--card:#1e293b;--bd:#334155;--tx:#e2e8f0;--mu:#94a3b8;--pri:#2b5288;--red:#f87171;--redb:#3b1414;--grn:#34d399;--grnb:#0d3a2a;--amb:#fbbf24;--ambb:#3d2a08}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 "Segoe UI",system-ui,sans-serif}
.top{background:var(--pri);color:#fff;padding:8px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.top h1{font-size:15px;font-weight:700;margin-right:auto}
.top a{color:#fff;font-size:13px;opacity:.85;text-decoration:none}
.wrap{padding:14px 16px 50px}
#info{font-size:12.5px;color:var(--mu);margin-bottom:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:8px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:5px 10px;border-left:3px solid var(--bd);cursor:pointer;user-select:none}
.card:hover{background:var(--bg)}.card.on{outline:2px solid var(--pri);outline-offset:-1px}
.card.bad{border-left-color:var(--red)}.card.ok{border-left-color:var(--grn)}.card.warn{border-left-color:var(--amb)}
.card b{display:block;font-size:11.5px;font-weight:400;color:var(--mu)}
.card .n{font-size:15px;font-weight:400;line-height:1.35}
.card .s{font-size:11px;color:var(--mu);line-height:1.3}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bar input,.bar select{padding:6px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);font-size:13px}
.bar input{width:230px}
button{padding:6px 12px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);font-size:13px;cursor:pointer}
button.p{background:var(--pri);color:#fff;border-color:var(--pri)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tabs .c{opacity:.75;margin-left:4px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{background:var(--bg);position:sticky;top:0;font-weight:600}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:var(--bg)}
.empty{padding:28px;text-align:center;color:var(--grn);font-weight:600}
.err{background:var(--redb);color:var(--red);padding:12px;border-radius:8px;margin-bottom:12px;display:none}
.tag{padding:1px 7px;border-radius:10px;font-size:11.5px;font-weight:600}
.t-tempo{background:var(--ambb);color:var(--amb)}.t-cash{background:var(--grnb);color:var(--grn)}
</style>
</head>
<body>
<div class="top"><h1>Cek Penjualan (PJ) vs Piutang (AR)</h1><a href="AR.html">AR</a><a href="index.html">PJ</a><button id="reload">Muat ulang data</button></div>
<div class="wrap">
<div class="err" id="err"></div>
<div id="info">Memuat data…</div>
<div class="cards" id="cards"></div>
<div class="bar">
<select id="fMon"></select><select id="fProd"><option value="">Semua produk</option><option>Minyak Fitri</option><option>Rupa Rupa</option></select><select id="fSales"></select>
<input id="fQ" placeholder="Cari faktur / customer…">
<button id="bCopy">Salin no. faktur</button><button class="p" id="bXls">Ekspor Excel</button>
</div>
<div class="tw"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rp=n=>Number(n||0).toLocaleString('id-ID');
const key=s=>String(s||'').trim().toUpperCase();

/* buka DB yang sudah ada saja; jangan sampai membuat DB kosong (bisa merusak PJ/AR) */
function openDB(name){return new Promise(res=>{
  let r;try{r=indexedDB.open(name)}catch(e){return res(null)}
  r.onupgradeneeded=e=>{try{e.target.transaction.abort()}catch(_){}};
  r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null);
})}
function idbGet(db,store,k){return new Promise(res=>{
  if(!db||!db.objectStoreNames.contains(store))return res(null);
  const q=db.transaction(store).objectStore(store).get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}
function idbAll(db,store){return new Promise(res=>{
  if(!db||!db.objectStoreNames.contains(store))return res([]);
  const q=db.transaction(store).objectStore(store).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])})}

function ymPJ(t){const m=String(t||'').match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);if(!m)return '';return (m[3].length===2?'20'+m[3]:m[3])+'-'+m[2].padStart(2,'0')}
function sortKey(t){const m=String(t||'').match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);return m?(m[3].length===2?'20'+m[3]:m[3])+m[2].padStart(2,'0')+m[1].padStart(2,'0'):''}

let PJ=[],ARm=new Map(),lists={},tab='tempo_x',cur=[],open_=true;
const TABS=[
 ['tempo_x','Tempo tidak ada di AR',''],
 ['tempo_in','Tempo ada di AR',''],
 ['cash_x','Cash tidak ada di AR',''],
 ['cash_in','Cash ada di AR',''],
 ['ar_x','AR tidak ada di PJ','Faktur di AR yang tidak ditemukan di PJ'],
 ['diff','Nominal beda','Faktur ada di keduanya tetapi nilainya berbeda']
];

async function load(){
  $('err').style.display='none';$('info').textContent='Memuat data…';
  const [dp,db,da]=await Promise.all([openDB('pj-parse-v1'),openDB('pjbatal-v1'),openDB('piutangHarianDB')]);
  const pc=await idbGet(dp,'c','parsed');
  const bt=await idbGet(db,'pjbatal-data','latest');
  const slots=await idbAll(da,'slots');
  const miss=[];
  if(!pc||!pc.files||!Object.keys(pc.files).length)miss.push('data PJ (buka halaman PJ dan upload file penjualan dulu)');
  if(!slots.length)miss.push('data AR (buka AR.html dan upload file AR dulu)');
  if(miss.length){const e=$('err');e.style.display='block';e.innerHTML='Belum ada '+miss.join(' dan ')+'. Halaman ini hanya bisa membaca data jika dibuka dari alamat/domain yang sama dengan PJ dan AR.'}
  const batal=(bt&&bt.items)||{};
  /* PJ per faktur */
  const g=new Map();
  Object.values((pc&&pc.files)||{}).forEach(f=>(f.rows||[]).forEach(r=>{
    const k=key(r['No. Faktur']);if(!k)return;
    let o=g.get(k);if(!o){o={fk:k,tgl:r.Tanggal,sales:r.Sales,cust:r.Customer,pay:String(r.Pembayaran||'').trim(),total:0,item:0,nf:0,nr:0};g.set(k,o)}
    o.total+=Number(r.Total)||0;o.item++;
    if(/FITRI/i.test(r.Produk||''))o.nf++;else o.nr++;
  }));
  PJ=[...g.values()].filter(o=>!batal[o.fk]).map(o=>(o.ym=ymPJ(o.tgl),o.sk=sortKey(o.tgl),o.prod=o.nf&&o.nr?'Minyak Fitri + Rupa Rupa':o.nf?'Minyak Fitri':'Rupa Rupa',o));
  const nBatal=g.size-PJ.length;
  /* AR (semua bulan & slot) */
  ARm=new Map();
  slots.forEach(s=>(s.rows||[]).forEach(r=>{
    const k=key(r.noFaktur);if(!k)return;
    const o=ARm.get(k);
    if(o){o.nominal+=Number(r.nominal)||0}else ARm.set(k,{fk:k,sales:r.sales,toko:r.toko,tgl:r.tglFaktur,nominal:Number(r.nominal)||0,sisa:r.sisaRiil,bulan:s.month,slot:s.k})
  }));
  /* bandingkan */
  const pjSet=new Set(PJ.map(o=>o.fk));
  const tempo=PJ.filter(o=>/^tempo$/i.test(o.pay)),cash=PJ.filter(o=>/^cash$/i.test(o.pay));
  const ada=o=>ARm.has(o.fk);
  lists={
    tempo_x:tempo.filter(o=>!ada(o)&&o.total!==0),
    tempo_in:tempo.filter(ada).map(o=>({...o,arNom:ARm.get(o.fk).nominal})),
    cash_x:cash.filter(o=>!ada(o)),
    cash_in:cash.filter(ada).map(o=>({...o,arNom:ARm.get(o.fk).nominal})),
    ar_x:[...ARm.values()].filter(a=>!pjSet.has(a.fk)),
    diff:PJ.filter(o=>ada(o)&&Math.abs(o.total-ARm.get(o.fk).nominal)>1).map(o=>({...o,arNom:ARm.get(o.fk).nominal,sel:o.total-ARm.get(o.fk).nominal}))
  };
  /* cari pasangan mirip: tanggal & nominal sama, nomor faktur beda (salah ketik?) */
  const N=x=>String(x||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const dkAR=v=>{if(typeof v==='number'||/^\d{5}$/.test(String(v))){const d=new Date(Math.round((Number(v)-25569)*864e5));return d.getUTCFullYear()+String(d.getUTCMonth()+1).padStart(2,'0')+String(d.getUTCDate()).padStart(2,'0')}
    const m=String(v||'').match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})/);return m?(m[3].length===2?'20'+m[3]:m[3])+m[2].padStart(2,'0')+m[1].padStart(2,'0'):''};
  const idxA=new Map(),idxP=new Map();
  lists.ar_x.forEach(a=>{a.dk=dkAR(a.tgl);const k=a.dk+'|'+Math.round(a.nominal);(idxA.get(k)||idxA.set(k,[]).get(k)).push(a)});
  [...lists.tempo_x,...lists.cash_x].forEach(o=>{const k=o.sk+'|'+Math.round(o.total);(idxP.get(k)||idxP.set(k,[]).get(k)).push(o)});
  const fmt=(fk,nm,mine)=>fk+(N(nm)===N(mine)?'':' ('+nm+')');
  [...lists.tempo_x,...lists.cash_x].forEach(o=>{const c=idxA.get(o.sk+'|'+Math.round(o.total))||[];o.mirip=c.map(a=>fmt(a.fk,a.toko,o.cust)).join(', ')});
  lists.ar_x.forEach(a=>{const c=idxP.get(a.dk+'|'+Math.round(a.nominal))||[];a.mirip=c.map(o=>fmt(o.fk,o.cust,a.toko)).join(', ')});
  $('info').textContent='PJ: '+g.size+' faktur ('+nBatal+' batal tidak dihitung) · AR: '+ARm.size+' faktur · dicocokkan lewat No. Faktur.';
  const mons=[...new Set(PJ.map(o=>o.ym).filter(Boolean))].sort().reverse(),sl=[...new Set(PJ.map(o=>o.sales).filter(Boolean))].sort();
  $('fMon').innerHTML='<option value="">Semua bulan</option>'+mons.map(m=>'<option>'+m+'</option>').join('');
  $('fSales').innerHTML='<option value="">Semua sales</option>'+sl.map(m=>'<option>'+esc(m)+'</option>').join('');
  render();
}
function sum(a){return a.reduce((x,o)=>x+(o.total||0),0)}
function F(o,ar){const m=$('fMon').value,s=$('fSales').value,pr=$('fProd').value;
  if(ar)return(!m||o.bulan===m)&&(!s||o.sales===s);
  return(!m||o.ym===m)&&(!s||o.sales===s)&&(!pr||(o.prod||'').includes(pr))}
function drawCards(){
  const L=k=>(lists[k]||[]).filter(o=>F(o,k==='ar_x'));
  const tx=L('tempo_x'),ti=L('tempo_in'),ci=L('cash_in'),cx=L('cash_x'),ax=L('ar_x'),df=L('diff');
  $('cards').innerHTML=
   card('tempo_x','Tempo tidak ada di AR',tx.length,tx.length?'bad':'ok','Rp '+rp(sum(tx)))+
   card('tempo_in','Tempo ada di AR',ti.length+' dari '+(ti.length+tx.length),'ok','Faktur Tempo sudah tercatat')+
   card('cash_in','Cash ada di AR',ci.length+' dari '+(ci.length+cx.length),'ok','Faktur Cash tercatat di AR')+
   card('cash_x','Cash tidak ada di AR',cx.length,cx.length?'warn':'ok','Rp '+rp(sum(cx)))+
   card('ar_x','AR tidak ada di PJ',ax.length,ax.length?'warn':'ok','Faktur AR tanpa pasangan di PJ')+
   card('diff','Nominal beda',df.length,df.length?'warn':'ok','Faktur cocok, nilai berbeda');
}
function card(id,t,n,c,s){return '<div class="card '+c+'" data-t="'+id+'"><b>'+t+'</b><div class="n">'+n+'</div><div class="s">'+esc(s)+'</div></div>'}

function render(){
  drawCards();
  document.querySelectorAll('#cards .card').forEach(c=>c.classList.toggle('on',open_&&c.dataset.t===tab));
  document.querySelector('.tw').style.display=open_?'':'none';
  if(!open_)return;
  const m=$('fMon').value,s=$('fSales').value,pr=$('fProd').value,q=$('fQ').value.trim().toLowerCase();
  let a=(lists[tab]||[]).filter(o=>F(o,tab==='ar_x')&&(!q||(o.fk+' '+(o.cust||o.toko||'')).toLowerCase().includes(q)));
  if(tab!=='ar_x')a=a.slice().sort((x,y)=>y.sk<x.sk?-1:y.sk>x.sk?1:x.fk.localeCompare(y.fk));
  cur=a;
  const pay=o=>'<span class="tag '+(/tempo/i.test(o.pay)?'t-tempo':'t-cash')+'">'+esc(o.pay)+'</span>';
  let h,rows;
  if(tab==='ar_x'){
    h=['No. Faktur','Sales','Toko','Bulan AR','Nominal AR','Sisa','Mirip di PJ'];
    rows=a.map(o=>[o.fk,esc(o.sales),esc(o.toko),o.bulan||'',rp(o.nominal),rp(o.sisa),esc(o.mirip||'-')]);
  }else{
    h=['Tanggal','No. Faktur','Customer','Sales','Produk','Bayar','Total PJ'];
    if(tab==='cash_in'||tab==='tempo_in'||tab==='diff')h.push('Nominal AR');if(tab==='diff')h.push('Selisih');if(tab==='tempo_x'||tab==='cash_x')h.push('Mirip di AR');
    rows=a.map(o=>{const r=[o.tgl,o.fk,esc(o.cust),esc(o.sales),o.prod,pay(o),rp(o.total)];if(tab==='cash_in'||tab==='tempo_in'||tab==='diff')r.push(rp(o.arNom));if(tab==='diff')r.push(rp(o.sel));if(tab==='tempo_x'||tab==='cash_x')r.push(esc(o.mirip||'-'));return r});
  }
  const num=i=>/Total|Nominal|Selisih|Sisa/.test(h[i]);
  $('th').innerHTML='<tr>'+h.map((x,i)=>'<th class="'+(num(i)?'r':'')+'">'+x+'</th>').join('')+'</tr>';
  $('tb').innerHTML=rows.length?rows.slice(0,3000).map(r=>'<tr>'+r.map((c,i)=>'<td class="'+(num(i)?'r':'')+'">'+c+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+h.length+'" class="empty">Tidak ada data di daftar ini ✓</td></tr>';
}
$('cards').onclick=e=>{const c=e.target.closest('.card');if(!c)return;if(open_&&tab===c.dataset.t)open_=false;else{tab=c.dataset.t;open_=true}render();if(open_)$('th').scrollIntoView({block:'nearest',behavior:'smooth'})};
['fMon','fSales','fProd'].forEach(i=>$(i).onchange=render);$('fQ').oninput=render;$('reload').onclick=load;
$('bCopy').onclick=()=>{navigator.clipboard.writeText(cur.map(o=>o.fk).join('\n')).then(()=>{$('bCopy').textContent='Tersalin '+cur.length;setTimeout(()=>$('bCopy').textContent='Salin no. faktur',1500)})};
$('bXls').onclick=()=>{
  const name=TABS.find(t=>t[0]===tab)[1];
  const data=cur.map(o=>tab==='ar_x'?{'No Faktur':o.fk,Sales:o.sales,Toko:o.toko,'Bulan AR':o.bulan,'Nominal AR':o.nominal,Sisa:o.sisa,'Mirip di PJ':o.mirip||''}:
   Object.assign({Tanggal:o.tgl,'No Faktur':o.fk,Customer:o.cust,Sales:o.sales,Produk:o.prod,Bayar:o.pay,'Total PJ':o.total},o.arNom!=null?{'Nominal AR':o.arNom}:{},o.sel!=null?{Selisih:o.sel}:{},o.mirip!=null?{'Mirip di AR':o.mirip}:{}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data),name.slice(0,31));
  XLSX.writeFile(wb,'cek-pj-ar_'+tab+'.xlsx');
};
try{new BroadcastChannel('laporan-data').onmessage=()=>load()}catch(_){}
load();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
</html>
